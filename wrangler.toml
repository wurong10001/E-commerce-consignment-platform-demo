# Cloudflare Worker 配置（最小）
# 在 Cloudflare 网页端 Import 此 GitHub 仓库时，网页会自动识别 Worker 并完成部署。
# 本文件不写 account_id —— 由网页端自动配置，避免泄露账号信息。
name = "ecommerce-consignment-demo"
main = "src/index.ts"
compatibility_date = "2026-11-24"

# 把前端 demo 的静态资源作为文本导入 Worker，使访问域名即可看到完整页面。
# 这样只需部署一个 Worker：/ → 交互式 Demo，/api/* → REST 接口。
[[rules]]
type = "Text"
globs = ["**/*.html", "**/*.css", "**/*.js"]

# 纯内存数据库：不使用 KV / D1 / 任何外部绑定。
