<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>电商代销平台 · 交互式 Demo</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-icon">DS</div>
      <div>
        <div class="brand-name">代销中台</div>
        <div class="brand-sub">E-Commerce Demo</div>
      </div>
    </div>
    <nav id="nav">
      <button class="nav-item active" data-page="dashboard"><span class="ico">◫</span> 总览看板</button>
      <button class="nav-item" data-page="products"><span class="ico">▦</span> 商品与库存</button>
      <button class="nav-item" data-page="orders"><span class="ico">▤</span> 订单中心</button>
      <button class="nav-item" data-page="funds"><span class="ico">◈</span> 资金中台</button>
      <button class="nav-item" data-page="reconcile"><span class="ico">☷</span> 对账中心</button>
      <button class="nav-item" data-page="commission"><span class="ico">◇</span> 分销佣金</button>
      <button class="nav-item" data-page="debug"><span class="ico">⚙</span> 调试控制台</button>
    </nav>
    <div class="sidebar-footer">
      <div class="env-badge"><span class="dot"></span> 本地演示环境</div>
      <button id="resetBtn" class="reset-btn">↺ 重置演示数据</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h1 id="pageTitle">总览看板</h1>
        <p id="pageDesc">全链路业务与资金流实时概览</p>
      </div>
      <div class="topbar-right">
        <span class="clock" id="clock"></span>
        <span class="pill" id="dataStatus">● 数据已就绪</span>
      </div>
    </header>
    <div id="content" class="content"></div>
  </main>
</div>

<div id="toast" class="toast"></div>
<div id="modal" class="modal" style="display:none">
  <div class="modal-box">
    <div class="modal-head"><h3 id="modalTitle">提示</h3><button id="modalClose" class="icon-btn">✕</button></div>
    <div id="modalBody" class="modal-body"></div>
    <div id="modalFoot" class="modal-foot"></div>
  </div>
</div>

<script src="js/state.js"></script>
<script src="js/actions.js"></script>
<script src="js/utils.js"></script>
<script src="js/pages.js"></script>
<script src="js/pages2.js"></script>
<script src="js/app.js"></script>
</body>
</html>
